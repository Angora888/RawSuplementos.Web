name: Frontend quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (report only)
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const r = require("./audit-report.json"); for (const [name, item] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via: item.via.map(v => typeof v === "string" ? v : {title: v.title, url: v.url, range: v.range})})); console.log("Summary:", JSON.stringify(r.metadata?.vulnerabilities || {}))'
          rm -f audit-report.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
